<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard{% endblock %} · PCU CivicSense</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">PCU</div>
      <div>
        <div class="brand-name">PCU CivicSense</div>
        <div class="brand-sub">Campus Grievances</div>
      </div>
    </div>
    <nav class="nav">
      <a href="{{ url_for('index') }}" class="nav-item {{ 'active' if request.endpoint == 'index' }}">
        <span class="nav-ico">📊</span> Dashboard
      </a>
      <a href="{{ url_for('complaints') }}" class="nav-item {{ 'active' if request.endpoint == 'complaints' }}">
        <span class="nav-ico">📋</span> Complaints
      </a>
      <a href="{{ url_for('new_complaint') }}" class="nav-item {{ 'active' if request.endpoint == 'new_complaint' }}">
        <span class="nav-ico">➕</span> New Complaint
      </a>
      <a href="{{ url_for('reports') }}" class="nav-item {{ 'active' if request.endpoint in ['reports', 'report_view'] }}">
        <span class="nav-ico">📈</span> Reports
      </a>
      <a href="{{ url_for('pipeline') }}" class="nav-item {{ 'active' if request.endpoint == 'pipeline' }}">
        <span class="nav-ico">⚙️</span> AI Pipeline
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="status-dot"></div>
      AI pipeline online
    </div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>

<!-- Global Lightbox Modal for Photo Evidence -->
<div id="lightbox-modal" class="lightbox-modal" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightbox-img" class="lightbox-content" src="" alt="Full Evidence" onclick="event.stopPropagation()">
</div>

<script>
function openLightbox(src) {
  const modal = document.getElementById('lightbox-modal');
  const img = document.getElementById('lightbox-img');
  if (modal && img) {
    img.src = src;
    modal.classList.add('active');
  }
}
function closeLightbox() {
  const modal = document.getElementById('lightbox-modal');
  if (modal) modal.classList.remove('active');
}
</script>

<!-- Global Complaint Detail & Batch Resolution Modal -->
{% include "components/complaint_modal.html" %}
<script src="{{ url_for('static', filename='js/complaint_modal.js') }}"></script>

</body>
</html>
